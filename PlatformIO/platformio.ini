; can2gauge - Forbes Automotive
; 2.1" round ESP32-S3 CAN / K-line gauge (OpenHaldex companion)
;
; Display: the YouriTech ET021CR01-Z glass, with YouriTech's own ST7701S init code (lib/Display_ST7701).
; [env:waveshare] builds the same firmware for the Waveshare ESP32-S3-Touch-LCD-2.1 dev board instead: its
; glass's register set (UGB, MIT) and the UGB R3/R5 data lanes. The board's CAN / K-line / IO parts aren't on it.

[platformio]
; Keep transient build/dependency files off the Google-Drive folder (same reason as OpenHaldex-C6:
; Drive locking cached build dirs causes spurious rebuilds and WinError 5/145, and the linker's
; temporary .rsp command files vanish before ld can open them).
build_dir = ${sysenv.SYSTEMDRIVE}/.platformio/can2gauge-pio/build
libdeps_dir = ${sysenv.SYSTEMDRIVE}/.platformio/can2gauge-pio/libdeps
; 0.24.15 (Adam, 2026-10-26): can2gauge has its OWN packages folder. custom_sdkconfig below rebuilds the Arduino
; framework's libraries with our settings, and pioarduino does that inside the packages folder - in the shared
; C:\.platformio\packages every other project would then reinstall them on its next build (and this one rebuild them
; again). Here nothing shared changes. Costs a second copy of the framework and toolchain on C: and a long first build.
packages_dir = ${sysenv.SYSTEMDRIVE}/.platformio/can2gauge-pio/packages
default_envs = can2gauge

[env:can2gauge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 500000
; 2026-10-26: esptool's stub loader keeps dropping over the S3's own USB port ("No more data to read from the serial
; port", most uploads). Without the stub esptool talks to the chip's ROM loader directly: slower, but it gets through.
upload_flags = --no-stub

board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; 0.24.15: the framework rebuilt with these (pioarduino "HybridCompile", in this project's own packages folder above).
; The ready-made libraries are set up for a general board; a 480 x 480 RGB glass fed from PSRAM wants:
; - 64-byte data cache lines (were 32): PSRAM is read in longer runs, which is most of what drawing does. Same cache
;   size, so no internal RAM is lost (a 64 KB cache would cost 32 KB of it - Bluetooth can't spare that).
; - the RGB panel's interrupt kept in internal RAM, so a flash read or write can't hold the glass's feed up.
; - the program run from PSRAM (copied there at start, ~3 MB): flash reads and writes (settings, logs, web files) no
;   longer pause everything else - on the glass that showed as lines dropping and white specks.
; "# ... is not set" lines are quoted: unquoted, the .ini reader would take them for comments.
; 2026-10-26: the project moved off Google Drive to C:\.platformio\can2gauge for this. ESP-IDF can't build in a folder
; with a space in its path ("My Drive"), and it downloads ~560 MB of components into the project folder
; (managed_components) - Drive would have synced all of it.
; The RGB interrupt in internal RAM and the program in PSRAM go TOGETHER: the interrupt keeps copying from the frame
; buffer (PSRAM) while flash is busy, which only works while PSRAM stays reachable then (XIP). 0.24.16 tried XIP off:
; "Cache disabled but cached memory region accessed" in the display interrupt, boot loop. XIP also wasn't the ~33 KB
; of internal RAM the rebuilt framework costs (175 KB after settings + filesystem either way).
; 0.24.17: internal RAM for Bluetooth. Internal RAM is shared between code that must run from it (IRAM) and data;
; the framework puts WiFi's and the network stack's busy paths in IRAM for speed (tens of KB). A gauge's AP serves one
; phone, so they go back to normal code space - with the program in PSRAM that costs little. WiFi CSI (radio channel
; data for diagnostics) is never used.
; 0.24.17: PSRAM started at boot, as the ready-made framework does. The rebuilt framework's template leaves
; SPIRAM_BOOT_INIT out, so PSRAM only joined the heap in Arduino's start-up - AFTER the global tables (psramCalloc)
; were made, and all seven fell back to internal RAM: ~30 KB (bench 2026-10-26, found by following their pointers).
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_PRE_CONFIGURE_MEMORY_PROTECTION=y
    '# CONFIG_ESP_WIFI_IRAM_OPT is not set'
    '# CONFIG_ESP_WIFI_EXTRA_IRAM_OPT is not set'
    '# CONFIG_ESP_WIFI_RX_IRAM_OPT is not set'
    '# CONFIG_LWIP_IRAM_OPTIMIZATION is not set'
    '# CONFIG_LWIP_EXTRA_IRAM_OPTIMIZATION is not set'
    '# CONFIG_ESP_WIFI_CSI_ENABLED is not set'
; 0.24.18: internal RAM for Bluetooth + WiFi together (Bluetooth on: 19 KB free after setup, largest piece 9 KB - a
; phone couldn't load the web page). The framework's WiFi is sized for a busy access point; the gauge's serves one phone
; and the ESP-NOW chain, so fewer buffers only slow big transfers (OTA, file downloads). Task stacks from the bench's
; 2-minute stack report (never-used bytes): esp_timer 7.5 KB of 8, tiT 3.1 of 4, Tmr Svc 2.4 of 3.1. The rebuild's
; template is the GENERIC S3 one: it had WiFi transmit buffers static (8 fixed in internal RAM) where the ready-made
; framework has them dynamic (in PSRAM here), and lwIP's out-of-order limit off - both matched to the ready-made.
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    '# CONFIG_ESP_WIFI_STATIC_TX_BUFFER is not set'
    CONFIG_ESP_WIFI_TX_BUFFER_TYPE=1
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
    CONFIG_ESP_WIFI_MGMT_SBUF_NUM=12
    CONFIG_ESP_WIFI_RX_BA_WIN=4
    CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=3072
    CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2304
; 0.24.19: after 4 h with Bluetooth retrying and a phone on, internal RAM had dipped to 3.5 KB (largest piece 7 KB) and
; the web page barely loaded. The framework sends every plain malloc() under 4 KB to internal RAM; the web server's
; replies, JSON text and Strings are all that size. From 1 KB up they now go to PSRAM (4 MB free) instead.
; And 16 KB of internal RAM is kept back that plain malloc() can never take - only code that asks for internal RAM by
; name (WiFi and Bluetooth drivers, task stacks) can use it - so a busy web page spills into PSRAM, not into WiFi's room.
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=1024
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=16384
; 0.28.2: the gauge's own fixed buffers came to ~75 KB of internal RAM (19:36 build's map), there all the time whether
; their feature was in use or not. This lets a buffer marked EXT_RAM_BSS_ATTR live in PSRAM instead (still cleared to
; zero at boot). ~44 KB of them are marked: settings, the OBD terminal and bench-test text, the ME7 logger's tables,
; the theme picker list, the chain update's packets, the web replies' copies ... None is touched by an interrupt or DMA.
; Left in internal RAM on purpose: the screen rotation rows, the sprite decoder's palette / row, the CAN receive ring.
    CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y
; 0.24.17: components the framework build leaves out - Arduino's whole set gets downloaded and compiled otherwise
; (RainMaker, Insights, Zigbee, speech recognition, Modbus, Ethernet chips ...), none of which a gauge uses: a smaller
; download and a shorter framework build. (They weren't the missing ~30 KB of internal RAM - that was PSRAM starting
; late, see custom_sdkconfig above.) Kept: mdns (c2g.local), littlefs, and the small cbor / cjson / libsodium helpers.
custom_component_remove =
    chmorgan/esp-libhelix-mp3
    espressif/esp-dsp
    espressif/esp-modbus
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_insights
    espressif/esp_modem
    espressif/esp_rainmaker
    espressif/network_provisioning
    espressif/qrcode
    espressif/rmaker_common
    espressif/dm9051
    espressif/ksz8851snl
    espressif/lan867x
    espressif/w5500

build_flags =
    ; project headers in include/ are shared by the lib/ libraries (GaugeUI, CANLine, ME7Logger, IOX, ...).
    ; PlatformIO builds each library in isolation and does not add include/ for them, so put it on the global
    ; include path here (this is also how LVGL below sees LV_CONF_PATH).
    ; Relative paths on purpose: ${PROJECT_DIR} comes out as j:\ or J:\ depending on how the folder was opened,
    ; and that one-letter difference changes the flags and forces a full rebuild of everything.
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; network (AsyncTCP build options, consumed by the library at compile time).
    ; NB: CONFIG_LWIP_MAX_SOCKETS is baked into the precompiled framework (16) and can't be changed from here, so
    ; it is not redefined - doing so only produced a "redefined" warning and had no effect.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0
    ; the web server task's stack, from internal RAM: 8 KB instead of the library's 16 KB (2026-10-14: internal RAM ran
    ; out). Measured: it never used more than 3.4 KB with the web UI open, so 8 KB leaves over twice that. It stays in
    ; internal RAM because OTA and file uploads write flash from this task.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    ; NimBLE (BLE ELM327 client, src/can2gauge_BLE.cpp, and since 0.30.0 the nav link's server, src/can2gauge_Nav.cpp):
    ; two connections (adapter + phone), its buffers in PSRAM.
    ; These can't be plain -D flags: the framework's own settings file is read after them and overrides them (they had
    ; no effect until 2026-10-14), so this header reads that file first and then sets ours - see the header.
    -include can2gauge_nimble_cfg.h

lib_deps =
    lvgl/lvgl@^9.3.0
    mathieucarbou/AsyncTCP@^3.1.4
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.3.8

lib_ignore =
    Async TCP
    AsyncTCP_RP2040W
    AsyncTCP_SSL
    ESPUI

monitor_filters =
    esp32_exception_decoder
    colorize

; 0.24.0: the filesystem image is built from a packed copy of data/ (web scripts / styles, make logos, the label
; index zipped; sprite packs with their frames zipped) - see tools/fs_pack.py. data/ itself stays plain.
; 0.24.14: tools/lvgl_speed.py compiles LVGL -O2 (speed); the rest of the firmware stays -Os (size, the app slot is ~92 % full)
extra_scripts =
    pre:tools/fs_pack.py
    pre:tools/lvgl_speed.py

[env:waveshare]
extends = env:can2gauge
build_flags =
    ${env:can2gauge.build_flags}
    -D CAN2GAUGE_WAVESHARE
