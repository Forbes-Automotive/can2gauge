; can2gauge / ME7Logger log configuration
; Upload this (renamed) together with your ECU's .ecu file (from ME7Info) via the web UI > K-line / ME7 > Upload,
; then pick both files and set the protocol to "ME7 logger". The first 8 variables also appear as gauge signals ME7 1..8.
[Configuration]
Version          = 1.01
SamplesPerSecond = 20   ; only used when the web UI's Samples/s is 0 - the web UI's value wins (1-50)

[LogVariables]
nmot_w      ; EngineSpeed
tmot        ; CoolantTemp
tans        ; IntakeAirTemp
pvdkds_w    ; BoostPressureActual
ps_w        ; BoostPressureSpecified
rl_w        ; EngineLoad
wped_w      ; AccelPedal
zwout       ; IgnitionTiming
lamsoni_w   ; LambdaSpecified
fr_w        ; LambdaControl
ub          ; BatteryVoltage
